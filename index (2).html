.mx{overflow-x:auto}.mx table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}.mx th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px;text-align:center}.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}.mx td{padding:10px 8px;text-align:center;border-top:1px solid var(--line)}.mx input{accent-color:var(--gold);width:18px;height:18px}

const defaultState=()=>({role:'Customer',table:1,category:'Beer',basket:{},ageConfirmed:false,waiter:1,orders:[],requests:[],assignments:{1:1,2:1,3:2,4:2,5:3,6:3},waiters:[{id:1,name:'Waiter 1',active:true},{id:2,name:'Waiter 2',active:true},{id:3,name:'Waiter 3',active:true}],soldOut:[],note:'',lastId:null,showConfirm:false,baseUrl:PUBLISHED});
let state=defaultState();let toastTimer=null,live=false,DB=null,resetArmed=false;
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(Number(n)||0);}
function shortTime(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function shortDate(t){return new Date(t).toLocaleDateString([],{day:'2-digit',month:'short'});}
function makeId(){return 'SH-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();}
function productInfo(name){for(const [category,group] of Object.entries(MENU)){const item=group.items.find(x=>x[0]===name);if(item)return {name:item[0],price:item[1],unit:group.unit,category};}return null;}
function basketCount(){return Object.values(state.basket).reduce((a,n)=>a+n,0);}
function basketTotal(){return Object.entries(state.basket).reduce((sum,[name,qty])=>sum+(productInfo(name)?.price||0)*qty,0);}
function showToast(message,error=false){const el=document.getElementById('toast');el.textContent=message;el.classList.toggle('error',error);el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200);}
function waiterForTable(table){return Number(state.assignments[table])||1;}
function badgeCount(role){if(role==='Kitchen')return state.orders.filter(o=>o.status==='new').length;if(role==='Waiter')return state.orders.filter(o=>o.waiter===state.waiter&&o.status==='ready').length+state.requests.filter(r=>r.waiter===state.waiter).length;return 0;}
function orderStatus(status){const labels={new:'Received',preparing:'Preparing',ready:'Ready',delivered:'Delivered'};return `<span class="status ${status}">${labels[status]||'Unknown'}</span>`;}
/* data layer: shared database when available, otherwise this device only */
const guard=p=>{if(p&&p.catch)p.catch(()=>showToast('Could not save. Check your connection and permissions.',true));};
const col=n=>DB.collection(n);
const API={
  addOrder(o){if(live)guard(col('orders').doc(o.id).set(o));else{state.orders.push(o);render();}},
  setStatus(id,s){if(live)guard(col('orders').doc(id).update({status:s}));else{state.orders.find(x=>x.id===id).status=s;render();}},
  addRequest(r){if(live)guard(col('requests').doc(r.id).set(r));else{state.requests.push(r);render();}},
  delRequest(id){if(live)guard(col('requests').doc(id).delete());else{state.requests=state.requests.filter(r=>r.id!==id);render();}},
  assign(t,w){state.assignments[t]=w;if(live){const d={};TABLES.forEach(x=>d['t'+x]=state.assignments[x]);guard(DB.doc('config/assign').set(d));}else render();},
  soldOut(list){state.soldOut=list;if(live)guard(DB.doc('config/soldout').set({list}));else render();},
  settle(t){const os=sessionOrders(t);const rs=state.requests.filter(r=>r.table===t&&r.type==='bill');if(live){os.forEach(o=>guard(col('orders').doc(o.id).update({paid:true,paidAt:Date.now(),paidBy:'Manager'})));rs.forEach(r=>guard(col('requests').doc(r.id).delete()));}else{os.forEach(o=>{o.paid=true;o.paidAt=Date.now();o.paidBy='Manager';});state.requests=state.requests.filter(r=>!(r.table===t&&r.type==='bill'));render();}},
  reset(){if(live){state.orders.forEach(o=>guard(col('orders').doc(o.id).delete()));state.requests.forEach(r=>guard(col('requests').doc(r.id).delete()));state.basket={};render();}else{const b=state.baseUrl;state=defaultState();state.baseUrl=b;render();}}
};
function subscribe(){
  col('orders').onSnapshot(s=>{state.orders=s.docs.map(d=>d.data()).sort((a,b)=>a.createdAt-b.createdAt);render();},()=>{});
  col('requests').onSnapshot(s=>{state.requests=s.docs.map(d=>d.data()).sort((a,b)=>a.createdAt-b.createdAt);render();},()=>{});
  DB.doc('config/assign').onSnapshot(d=>{if(d.exists){const v=d.data();TABLES.forEach(t=>{if(v['t'+t])state.assignments[t]=v['t'+t];});render();}},()=>{});
  DB.doc('config/soldout').onSnapshot(d=>{state.soldOut=d.exists?(d.data().list||[]):[];render();},()=>{});
  DB.doc('config/waiters').onSnapshot(d=>{if(d.exists&&Array.isArray(d.data().list)&&d.data().list.length)state.waiters=d.data().list;render();},()=>{});
}
function orderCard(order,actions='',track=false){const round=order.paid?0:state.orders.filter(o=>o.table===order.table&&!o.paid&&o.createdAt<=order.createdAt).length;
  const lines=(order.lines||[]).map(line=>`<div class="list-line"><span>${line.qty} × ${esc(line.name)}</span><span class="muted small">${esc(line.unit||'')}</span></div>`).join('');
  return `<article class="order"><div class="order-top"><span class="order-title">${esc(order.ref||order.id)} · Table ${String(order.table).padStart(2,'0')}${round>1?' · Round '+round:''}</span>${orderStatus(order.status)}</div><div class="order-meta">${shortDate(order.createdAt)} at ${shortTime(order.createdAt)} · ${wName(order.waiter)}${(order.eta&&(order.status==='new'||order.status==='preparing'))?' · Est. '+order.eta+' min':''}</div>${track?tracker(order.status):''}${lines}${order.note?`<div class="notice">Note: ${esc(order.note)}</div>`:''}<div class="order-top" style="margin-top:10px"><strong class="price">${money(order.total)}</strong>${actions}</div></article>`;
}
const STEPS=[['new','Received'],['preparing','Preparing'],['ready','Ready'],['delivered','Delivered']];
function tracker(status){const i=status==='delivered'?4:STEPS.findIndex(s=>s[0]===status);return `<div class="track">${STEPS.map((s,k)=>`<div class="step ${k<i?'done':k===i?'now':''}"><i></i><span>${s[1]}</span></div>`).join('')}</div>`;}
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'just now':m+' min ago';};
const sessionOrders=t=>state.orders.filter(o=>o.table===t&&!o.paid);
const tableTotal=t=>sessionOrders(t).reduce((a,o)=>a+o.total,0);
const isTableLink=()=>/^#table-\d+$/.test(location.hash);
function renderTabs(){const tabs=document.getElementById('roleTabs');if(isTableLink()){tabs.classList.add('hidden');return;}tabs.classList.remove('hidden');tabs.innerHTML=['Customer','Waiter','Kitchen','Manager','Platform Admin'].map(role=>`<button class="tab ${state.role===role?'active':''}" data-role="${role}" type="button">${role}${badgeCount(role)?`<span class="count">${badgeCount(role)}</span>`:''}</button>`).join('');}
function renderCustomer(){
 const table=state.table;const mine=sessionOrders(table);const lastO=state.orders.find(o=>o.id===state.lastId);const myReqs=state.requests.filter(r=>r.table===table);const groups=Object.entries(MENU);const group=MENU[state.category];
 return `<section class="panel hero"><div class="eyebrow">Welcome in · Table ${String(table).padStart(2,'0')}</div><h2><span style="color:var(--cream)">Eat.</span> <span style="color:var(--gold)">Pray.</span> <span style="color:var(--green)">Groove.</span></h2><p>Browse the menu, place your order and let our team take care of the rest.</p><div class="table-line"><label for="tableSelect" class="small muted">Your table</label>${isTableLink()?`<strong>Table ${String(table).padStart(2,'0')}</strong>`:`<select class="field" id="tableSelect">${TABLES.map(t=>`<option value="${t}" ${t===table?'selected':''}>Table ${String(t).padStart(2,'0')}</option>`).join('')}</select>`}<span class="pill">Your waiter: ${wName(waiterForTable(table))}</span></div></section>
 ${lastO&&!lastO.paid&&state.showConfirm?`<section class="panel confirm"><div class="eyebrow">Order confirmed</div><h2>${esc(lastO.ref||lastO.id)}</h2><p class="muted">Estimated preparation time: about <strong>${lastO.eta||8} minutes</strong>. Show this number to your waiter if you need to.</p>${tracker(lastO.status)}<button class="btn secondary" data-dismiss="1" type="button">Dismiss</button></section>`:''}${myReqs.length?`<section class="panel request"><div class="eyebrow">Request sent</div>${myReqs.map(r=>`<div class="list-line"><span>${r.type==='bill'?'Bill requested':'Waiter called'} · ${ago(r.createdAt)}</span><span class="pill">${wName(r.waiter)} notified</span></div>`).join('')}</section>`:''}<div class="section-head"><div><div class="eyebrow">Explore the menu</div><h2>What can we get you?</h2><p class="muted small">Prices are displayed in South African rand.</p></div><span class="pill">${group.items.length} items</span></div>

document.addEventListener('click',e=>{const el=e.target.closest('[data-pf]');if(!el)return;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();const a=el.dataset.pf,id=el.dataset.id,v=el.dataset.v;const val=i=>{const x=document.getElementById(i);return x?x.value.trim():'';};
 if(a==='tab'){PFTAB=v;render();return;}
 if(a==='open'){state.role='Customer';render();return;}
 if(a==='status'){pfMut(()=>{const r=pfRest(id);if(r)r.status=v;});showToast(v==='suspended'?'Venue suspended.':'Venue is active.');return;}
 if(a==='del'){const r=pfRest(id);if(r&&r.live)return showToast('This venue runs the live ordering screens and cannot be deleted here.',true);if(!pfArm('del:'+id))return;pfMut(()=>{PF.restaurants=PF.restaurants.filter(x=>x.id!==id);PF.users=PF.users.filter(u=>u.venue!==id);});showToast('Venue deleted. Its payment and commission history is kept.');return;}
 if(a==='add'){const name=val('pfName'),plan=val('pfPlan'),tables=Math.round(Number(val('pfTables')));if(!name)return showToast('Enter a restaurant name.',true);if(!(tables>=1&&tables<=99))return showToast('Tables must be between 1 and 99.',true);if(!PF.plans[plan])return showToast('Choose a plan.',true);pfMut(()=>PF.restaurants.push({id:pfId(),name,city:val('pfCity'),plan,status:'onboarding',sub:'trial',billing:'monthly',discount:0,renews:null,tables}));showToast('Restaurant added.');return;}
 if(a==='pay'){const r=pfRest(val('pfPayR')),amt=pfNum(val('pfPayAmt')),ref=val('pfPayRef');if(!r)return showToast('Choose a venue.',true);if(!(amt>0))return showToast('Enter the amount paid.',true);if(!ref)return showToast('Enter a payment reference.',true);if(PF.payments.some(p=>p.ref.toLowerCase()===ref.toLowerCase()))return showToast('That payment reference has already been used.',true);
  pfMut(()=>{PF.payments.push({id:pfId(),rid:r.id,rname:r.name,amount:amt,ref,at:Date.now(),cycle:r.billing==='annual'?'Annual':'Monthly'});r.sub='active';const d=new Date(Math.max(Date.now(),r.renews||0));if(r.billing==='annual')d.setFullYear(d.getFullYear()+1);else d.setMonth(d.getMonth()+1);r.renews=d.getTime();
   });showToast('Payment recorded.');return;}
 if(a==='calc'){const r=pfRest(id);if(!r)return;if(PF.commission.value==null)return showToast('Set the commission rate first.',true);const since=PF.lastCalc[id]||0;const os=state.orders.filter(o=>o.paid&&o.createdAt>since);if(!os.length)return showToast('No newly paid orders to calculate.',true);const base=os.reduce((s,o)=>s+o.total,0);const ca=pfCommAmt(r,base);if(ca==null)return showToast('This venue is not on a commission plan.',true);pfMut(()=>{pfAddComm(r,ca,'Orders to '+shortDate(Date.now())+' ('+os.length+')');PF.lastCalc[id]=Date.now();});showToast('Commission record created as Pending.');return;}
 if(a==='cstat'){const x=PF.commissions.find(c=>c.id===id);if(!x)return;if(v==='reversed'&&!pfArm('rev:'+id))return;pfMut(()=>{x.status=v;});showToast('Commission '+PF_COMM[v].toLowerCase()+'.');return;}
 if(a==='uadd'){const name=val('pfUName'),role=val('pfURole'),venue=role==='Platform Admin'?'all':val('pfUVenue');if(!name)return showToast('Enter a name.',true);pfMut(()=>PF.users.push({id:pfId(),name,email:val('pfUEmail'),role,venue,active:true}));showToast('User added.');return;}
 if(a==='udel'){const u=PF.users.find(x=>x.id===id);if(!u)return;if(u.role==='Platform Admin'&&u.active&&pfAdmins()<=1)return showToast('Keep at least one active Platform Admin.',true);if(!pfArm('udel:'+id))return;pfMut(()=>{PF.users=PF.users.filter(x=>x.id!==id);});showToast('User removed.');}
});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset&&el.dataset.pfc;if(!k)return;const id=el.dataset.id,pl=PF.plans[el.dataset.plan];
 if(k==='cfilter'){PF_CF=el.value;render();return;}
 if(k==='pname'){const n=el.value.trim();if(!n||!pl){showToast('Plan name cannot be empty.',true);render();return;}pfMut(()=>{pl.name=n.slice(0,40);});return;}
 if(k==='pprice'||k==='pannual'||k==='pper'||k==='cvalue'||k==='disc'){const n=pfNum(el.value);if(Number.isNaN(n)||(k==='disc'&&(n==null||n>100))){showToast(k==='disc'?'Discount must be 0 to 100.':'Enter a valid amount.',true);render();return;}
  if(k==='cvalue'&&n!=null&&PF.commission.type==='percent'&&n>100){showToast('A percentage cannot exceed 100.',true);render();return;}
  pfMut(()=>{if(k==='cvalue')PF.commission.value=n;else if(k==='disc'){const r=pfRest(id);if(r)r.discount=n;}else if(pl)pl[{pprice:'price',pannual:'annual',pper:'perOrder'}[k]]=k==='pper'?(n||0):n;});return;}
 if(k==='pcomm'){if(pl)pfMut(()=>{pl.commission=el.checked;});return;}
 if(k==='pfeat'){if(pl)pfMut(()=>{pl.features=el.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,30);});return;}
 if(k==='ctype'){pfMut(()=>{PF.commission.type=el.value;if(el.value==='percent'&&PF.commission.value>100)PF.commission.value=null;});return;}
 if(k==='cbasis'){pfMut(()=>{PF.commission.basis=el.value;});return;}
 if(k==='cfreq'){pfMut(()=>{PF.commission.frequency=el.value;});return;}
 if(k==='plan'){const y=window.scrollY,r0=pfRest(id);PF_PCH=r0&&el.value!==r0.plan?{id,to:el.value}:null;render();window.scrollTo(0,y);return;}if(k==='billing'||k==='sub'){pfMut(()=>{const r=pfRest(id);if(r)r[k]=el.value;});return;}
 if(k==='perm'){const rn=el.dataset.rn;if(rn==='Platform Admin')return;pfMut(()=>{if(!PF.perms[rn])PF.perms[rn]=PF_PERMS.map(()=>false);PF.perms[rn][Number(el.dataset.i)]=el.checked;});return;}
 const u=PF.users.find(x=>x.id===id);if(!u)return;
 if(k==='urole'){if(u.role==='Platform Admin'&&el.value!=='Platform Admin'&&u.active&&pfAdmins()<=1){showToast('Keep at least one active Platform Admin.',true);render();return;}pfMut(()=>{u.role=el.value;if(u.role==='Platform Admin')u.venue='all';});return;}
 if(k==='uvenue'){pfMut(()=>{u.venue=el.value;});return;}
 if(k==='uactive'){if(!el.checked&&u.role==='Platform Admin'&&pfAdmins()<=1){showToast('Keep at least one active Platform Admin.',true);render();return;}pfMut(()=>{u.active=el.checked;});}
});
/* ===== Waiter registry: permanent numeric IDs, editable display names (Manager) ===== */
const wById=id=>(state.waiters||[]).find(w=>w.id===Number(id));
function wName(id){const w=wById(id);return w?w.name:'Waiter '+id;}
function wIds(){return (state.waiters||[]).slice().sort((a,b)=>(b.active-a.active)||(a.id-b.id)).map(w=>w.id);}
const wLabel=id=>{const w=wById(id);return wName(id)+(w&&!w.active?' (inactive)':'');};
const wTaken=(n,except)=>(state.waiters||[]).some(w=>w.id!==except&&w.name.toLowerCase()===n.toLowerCase());
const wTables=id=>TABLES.filter(t=>waiterForTable(t)===id).map(t=>'Table '+String(t).padStart(2,'0'));
function setWaiters(list){state.waiters=list;if(live)guard(DB.doc('config/waiters').set({list:JSON.parse(JSON.stringify(list))}));render();}
function waiterPanel(){const ws=(state.waiters||[]).slice().sort((a,b)=>(b.active-a.active)||(a.id-b.id));
 return `<section class="panel"><div class="eyebrow">Front of house</div><h2>Waiters</h2><p class="muted small">Rename waiters, add new ones or deactivate them. Each waiter keeps a permanent ID, so past orders always stay linked to the right person.</p>${ws.map(w=>{const ts=wTables(w.id);return `<div class="wrow"><div class="wmain"><input class="field pf" value="${esc(w.name)}" maxlength="24" aria-label="Display name for waiter ${w.id}" data-wname="${w.id}"><span class="muted small">ID ${w.id} · ${ts.length?ts.join(', '):'No tables assigned'}</span></div><label class="sw"><input type="checkbox" data-wactive="${w.id}" ${w.active?'checked':''}><span></span>${w.active?'Active':'Inactive'}</label></div>`;}).join('')}<div class="wadd"><input class="field pf" id="newWaiter" maxlength="24" placeholder="New waiter name" aria-label="New waiter name"><button class="btn" data-wadd type="button">Add waiter</button></div></section>`;}
document.addEventListener('click',e=>{if(!e.target.closest('[data-wadd]'))return;const i=document.getElementById('newWaiter'),n=((i&&i.value)||'').trim().slice(0,24);if(!n)return showToast('Enter the new waiter’s name.',true);if(wTaken(n))return showToast('Another waiter already uses that name.',true);const ws=state.waiters||[];setWaiters(ws.concat({id:Math.max(0,...ws.map(w=>w.id))+1,name:n,active:true}));showToast(n+' added.');});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset||{};
 if(d.wname){const id=Number(d.wname),n=el.value.trim().slice(0,24),w=wById(id);if(!w||n===w.name)return;if(!n){showToast('A waiter needs a name.',true);render();return;}if(wTaken(n,id)){showToast('Another waiter already uses that name.',true);render();return;}setWaiters(state.waiters.map(x=>x.id===id?{...x,name:n}:x));showToast('Renamed to '+n+'.');return;}
 if(d.wactive){const id=Number(d.wactive),w=wById(id);if(!w)return;if(!el.checked){const ts=wTables(id);if(ts.length){showToast(w.name+' still has '+ts.join(', ')+'. Reassign those tables first.',true);render();return;}if(state.waiters.filter(x=>x.active).length<=1){showToast('Keep at least one active waiter.',true);render();return;}}setWaiters(state.waiters.map(x=>x.id===id?{...x,active:el.checked}:x));showToast(w.name+(el.checked?' is active.':' is inactive.'));}});
function route(){const m=location.hash.match(/^#table-(\d+)$/);if(m&&TABLES.includes(Number(m[1])))state.table=Number(m[1]);else if(location.hash==='#waiter')state.role='Waiter';else if(location.hash==='#kitchen')state.role='Kitchen';else if(location.hash==='#manager')state.role='Manager';else if(location.hash==='#platform')state.role='Platform Admin';render();}
window.addEventListener('hashchange',route);
route();
setTimeout(()=>{const a=document.querySelector('.tabs .active'),c=a&&a.parentElement;if(c)c.scrollLeft=a.offsetLeft-(c.clientWidth-a.offsetWidth)/2;},50);
if(window.claude&&claude.use)claude.use('db').then(d=>{if(d){DB=d;live=true;try{subscribe();}catch(e){console.error(e);}try{pfSubscribe();}catch(e){console.error(e);}render();}}).catch(()=>{});
</script>
